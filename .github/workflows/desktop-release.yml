name: Desktop release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build Windows release
        run: npm run release:win -w @thongnhat/desktop
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            apps/desktop/release/*/*.exe
            apps/desktop/release/*/*.exe.blockmap
            apps/desktop/release/*/latest.yml
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build unsigned macOS release
        run: npm run release:mac -w @thongnhat/desktop
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            apps/desktop/release/*/*.dmg
            apps/desktop/release/*/*.dmg.blockmap
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - name: Publish GitHub Release
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          gh release create "${{ github.ref_name }}" release-assets/* --title "$version" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
